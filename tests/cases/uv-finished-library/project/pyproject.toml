[project]
name = "uvp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Laura", email = "lauraku888@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "idna==3.6",
]

[project.scripts]
uvp = "uvp:main"

[project.optional-dependencies]
extra = [
    "six>=1.17.0", # finished library: six, a complete compatibility layer
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "3 days"
prerelease = "disallow"

[dependency-groups]
dev = [
    "iniconfig==2.0.0",
]
